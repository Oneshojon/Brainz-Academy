{% if user.is_authenticated %}
<a href="/messaging/inbox/"
   aria-label="Inbox{% if unread_message_count %} — {{ unread_message_count }} unread{% endif %}"
   style="position:relative;display:inline-flex;align-items:center;color:inherit;
          text-decoration:none;padding:.25rem .35rem">

  <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"
       viewBox="0 0 24 24" aria-hidden="true">
    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
  </svg>

  <span id="bell-count"
        style="position:absolute;top:-3px;right:-5px;
               min-width:17px;height:17px;padding:0 4px;
               background:#ef4444;color:#fff;border-radius:999px;
               font-size:10px;font-weight:700;line-height:17px;
               text-align:center;font-family:'Plus Jakarta Sans',sans-serif;
               display:{% if unread_message_count and unread_message_count > 0 %}inline-block{% else %}none{% endif %};"
        aria-hidden="true">{{ unread_message_count }}</span>
</a>
{% endif %}
